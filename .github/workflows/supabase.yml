name: Supabase

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml', 'apps/game/src/sync.ts', 'apps/game/src/progress.ts', 'apps/game/test/sync.integracion.test.ts']
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Arrancar Supabase local
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,mailpit,postgres-meta,supavisor
      - name: Aplicar las migraciones desde cero
        run: supabase db reset
      - name: Tests de permisos (RLS) y privacidad
        run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Test de integración del progreso (login anónimo, guardar y recuperar)
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          export SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          npm test -w @kalku/game -- sync.integracion
