name: Supabase · aplicar migraciones

# Se lanza solo al fusionar en main algo que toque supabase/ o el paquete de
# ejercicios (la función `answer` lo lleva dentro). También se puede lanzar a
# mano desde Actions, por ejemplo sobre la rama de un PR para probar su vista previa.
# Aplica las migraciones y despliega las Edge Functions `answer` y `child-session`.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/exercises/**'
  workflow_dispatch:

# Nunca dos a la vez contra la misma base de datos.
concurrency:
  group: supabase-migrar
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    if: github.actor == 'Mijusk'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: «latest» consulta la API de GitHub y a veces falla por límite de peticiones.
          version: 3.2.0
      - run: supabase link --project-ref nxaehojnwutxpshqwzeo
      # Fusionar o lanzarlo a mano ya es la confirmación: --yes evita la pregunta interactiva.
      - run: supabase db push --remote --yes
      # La función lleva @kalku/exercises dentro: se empaqueta antes de subirla.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @kalku/exercises && npm run build:function
      # El token necesita el permiso «Edge Functions» (lectura y escritura).
      # Igual que db push: sin --yes la CLI pide confirmación y falla en Actions.
      - run: supabase functions deploy answer --project-ref nxaehojnwutxpshqwzeo --yes
      # child-session necesita además el secreto KALKU_JWT_SECRET (lo pone Luis en Edge Functions → Secrets).
      - run: supabase functions deploy child-session --project-ref nxaehojnwutxpshqwzeo --yes
      # Entrar en la clase (#53): usa el mismo secreto KALKU_JWT_SECRET que child-session.
      - run: supabase functions deploy class-session --project-ref nxaehojnwutxpshqwzeo --yes
