name: Supabase · aplicar migraciones

# Solo lo lanza Luis a mano desde Actions, después de fusionar.
# Aplica las migraciones y despliega la Edge Function `answer` (#46).
on:
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    if: github.actor == 'Mijusk'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref nxaehojnwutxpshqwzeo
      # Lanzarlo a mano ya es la confirmación: --yes evita la pregunta interactiva.
      - run: supabase db push --remote --yes
      # La función lleva @kalku/exercises dentro: se empaqueta antes de subirla.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @kalku/exercises && npm run build:function
      # El token necesita el permiso «Edge Functions» (lectura y escritura).
      # Igual que db push: sin --yes la CLI pide confirmación y falla en Actions.
      - run: supabase functions deploy answer --project-ref nxaehojnwutxpshqwzeo --yes
