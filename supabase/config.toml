# Supabase local (CI y desarrollo). El proyecto real está en Frankfurt (eu-central-1).
project_id = "kalku"

[api]
enabled = true
schemas = ["public"]

[db]
major_version = 15

[auth]
enabled = true
# Cada niño entra con un login anónimo: auth.uid() es su id (children.id).
enable_anonymous_sign_ins = true
enable_signup = true

# Adultos: login por enlace de correo, sin contraseña (#47). En local los correos
# los recoge Inbucket (http://localhost:54324). En el proyecto real el SMTP de Brevo
# se configura en el panel de Supabase (Auth → SMTP), nunca con claves en este repo.
[auth.email]
enable_signup = true
enable_confirmations = true

# Corrige las respuestas del niño (#46). Se empaqueta con `npm run build:function`.
[functions.answer]
enabled = true
verify_jwt = true
entrypoint = "./functions/answer/dist/index.js"

# El adulto entra como uno de sus niños en otro aparato (#47). Necesita el secreto
# KALKU_JWT_SECRET (`supabase secrets set`), que no está en el repo.
[functions.child-session]
enabled = true
verify_jwt = true
entrypoint = "./functions/child-session/dist/index.js"

# El niño entra en su clase con apodo + animal o con el código de la tarjeta (#53). Necesita el
# mismo secreto KALKU_JWT_SECRET. Sin verify_jwt: el niño aún no tiene sesión (o la tiene caducada).
[functions.class-session]
enabled = true
verify_jwt = false
entrypoint = "./functions/class-session/dist/index.js"

# Resumen semanal por correo (#56). Lo llama la tarea semanal de la base de datos con su propia
# clave (SUMMARY_CRON_SECRET), no con un JWT. Sin BREVO_API_KEY y SUMMARY_SENDER no envía nada.
[functions.weekly-summary]
enabled = true
verify_jwt = false
entrypoint = "./functions/weekly-summary/dist/index.js"

# Baja del resumen desde el enlace del correo (#56): sin inicio de sesión, protegida por la firma del token.
[functions.unsubscribe]
enabled = true
verify_jwt = false
entrypoint = "./functions/unsubscribe/dist/index.js"
